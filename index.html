*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit}button{font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 14px}
